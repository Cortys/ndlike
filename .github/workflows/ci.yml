name: CI

on:
  pull_request:
  push:
    branches: [master, main, ndlike-extract]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.13'
      - run: uv run --locked --all-extras prek run --all-files

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked --group test pytest

  backend-tests:
    name: Backends (${{ matrix.backend }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        backend: [torch, jax, both]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.backend == 'torch'
        run: uv sync --locked --extra torch
      - if: matrix.backend == 'jax'
        run: uv sync --locked --extra jax
      - if: matrix.backend == 'both'
        run: uv sync --locked --all-extras
      - run: uv run --locked --no-sync pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv build
      - run: uvx twine check dist/*
